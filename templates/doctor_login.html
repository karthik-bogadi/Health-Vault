{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-header">
      <div class="auth-icon" style="background:linear-gradient(135deg,#1d4ed8,#3b82f6)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <h2>Doctor Login</h2>
      <p>Sign in to access the patient report portal</p>
    </div>

    <form method="POST" action="{{ url_for('doctor_login') }}">
      {# Preserve redirect target (e.g. /doctor?key=ABC from QR scan) #}
      <input type="hidden" name="next" value="{{ next_url }}">

      <div class="form-group">
        <label for="email">Doctor Email</label>
        <input id="email" name="email" type="email" placeholder="doctor@hospital.com" required autocomplete="email">
      </div>

      <div class="form-group" style="margin-top:0.85rem">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter your password" required autocomplete="current-password">
      </div>

      <div style="margin-top:1.5rem">
        <button type="submit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Sign In as Doctor
        </button>
      </div>
    </form>

    <div class="form-divider">or</div>

    <div class="auth-footer">
      <span class="muted" style="font-size:0.82rem">Patient account?&nbsp;</span>
      <a class="link" href="{{ url_for('login') }}" style="font-size:0.82rem">Patient login &rarr;</a>
    </div>

  </div>

  {% include "partials/doctor_account_help.html" %}
</div>
{% endblock %}
