{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-header">
      <div class="auth-icon" style="background:linear-gradient(135deg,#0f766e,#14b8a6)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <h2>Admin Login</h2>
      <p>Sign in to manage doctor accounts</p>
    </div>

    <form method="POST" action="{{ url_for('admin_login') }}">
      <div class="form-group">
        <label for="email">Admin Email</label>
        <input id="email" name="email" type="email" placeholder="admin@healthvault.com" required autocomplete="email">
      </div>

      <div class="form-group" style="margin-top:0.85rem">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter admin password" required autocomplete="current-password">
      </div>

      <div style="margin-top:1.5rem">
        <button type="submit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Sign In as Admin
        </button>
      </div>
    </form>

    <div class="auth-footer" style="margin-top:1.25rem">
      <span class="muted" style="font-size:0.78rem">Default (dev): admin@healthvault.com / admin123</span>
    </div>

  </div>
</div>
{% endblock %}
